[build]
  command = "npm run netlify:build"
  publish = "netlify/public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"

[functions]
  external_node_modules = ["express"]
  node_bundler = "esbuild"

[[redirects]]
  from = "/healthz"
  to = "/.netlify/functions/setup/healthz"
  status = 200
  force = true

[[redirects]]
  from = "/auth/*"
  to = "/.netlify/functions/setup/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/setup/api/:splat"
  status = 200
  force = true
